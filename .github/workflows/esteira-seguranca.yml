# Integração com a Esteira de Segurança — cliente piloto (WebGoat).
#
# api-url aponta pro túnel temporário da API local (teste de validação,
# não é a URL de produção). Fora isso, este arquivo é igual ao de um
# cliente real (examples/client-workflow.yml) — usa a tag v1 oficial,
# sem overrides de actions-ref (o default do reusable workflow já é
# "v1").

name: Esteira de Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    uses: esteiradeseguranca/workflow/.github/workflows/security-scan.yml@v1.1
    secrets:
      token: ${{ secrets.ESTEIRA_TOKEN }}
    # Opcional: descomente para bloquear o merge quando houver achado
    # aberto (ou sendo corrigido) de severidade crítica ou alta —
    # achado liberado temporariamente ou marcado falso-positivo pelo
    # cliente não bloqueia.
    with:
      fail-on-critical: true
