# Integração com a Esteira de Segurança — cliente piloto (WebGoat).
#

name: Esteira de Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    uses: esteiradeseguranca/workflow/.github/workflows/security-scan.yml@v1
    secrets:
      token: ${{ secrets.ESTEIRA_TOKEN }}
    # Opcional: descomente para bloquear o merge quando houver achado
    # aberto (ou sendo corrigido) de severidade crítica ou alta —
    # achado liberado temporariamente ou marcado falso-positivo pelo
    # cliente não bloqueia.
    with:
      fail-on-critical: true
